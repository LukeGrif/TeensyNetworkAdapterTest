; PlatformIO config. The sketch lives in TeensyEthernetTest/ so the same
; folder also opens directly in the Arduino IDE.
[platformio]
src_dir = TeensyEthernetTest
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps = ssilverman/QNEthernet@^0.37.0
monitor_speed = 115200
